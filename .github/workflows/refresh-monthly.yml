# Monthly agent pass over the research-extracted curated sources, plus the
# sweep of the curation backlog (Coefficient is refreshed weekly by
# ingest-weekly.yml, deterministically). Output is a PULL REQUEST — nothing
# reaches the database until a human merges it (ingest-on-merge.yml then
# ingests).
#
# Two jobs on purpose. `queue` holds the Supabase secrets and only reads,
# producing the backlog as a text artifact. `refresh` runs the agent and has
# no Supabase secrets at all, so the agent cannot reach the database even in
# principle — it reads the artifact instead. Keep that split.
#
# Requires secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: refresh-monthly
on:
  schedule:
    - cron: '13 9 3 * *' # 09:13 UTC on the 3rd
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Read-only, and the only job that can see the database.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_TRACE_DB_SCHEMA: ${{ secrets.NEXT_PUBLIC_TRACE_DB_SCHEMA }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Collect the curation backlog
        run: |
          mkdir -p /tmp/queue
          bun run scripts/report-unmatched.ts 60 > /tmp/queue/unmatched.txt 2>&1
          bun run scripts/report-untagged.ts 40 > /tmp/queue/untagged.txt 2>&1
          bun run scripts/dedup.ts > /tmp/queue/dedup.txt 2>&1
          head -20 /tmp/queue/unmatched.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curation-queue
          path: /tmp/queue

  refresh:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: curation-queue
          path: /tmp/queue
      - name: Agent pass over curated sources
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: Follow the instructions in .github/prompts/monthly-refresh.md
          claude_args: '--allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"'
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "No changes found this month."
            exit 0
          fi
          BRANCH="refresh/$(date +%Y-%m)"
          git config user.name 'trace-refresh[bot]'
          git config user.email 'noreply@manifund.org'
          git checkout -b "$BRANCH"
          git add data/
          git commit -m "Monthly source refresh $(date +%Y-%m)"
          git push -f origin "$BRANCH"
          if [ ! -f /tmp/refresh-summary.md ]; then
            { echo 'Deterministic Coefficient refresh (agent summary missing):'
              echo '```'
              git show --stat HEAD | tail -20
              echo '```'
            } > /tmp/refresh-summary.md
          fi
          { echo; echo '---'; echo 'Merging this PR is the approval: ingest-on-merge will load the new rows into the database.'; } >> /tmp/refresh-summary.md
          if ! gh pr create --title "Monthly source refresh $(date +%Y-%m)" \
            --body-file /tmp/refresh-summary.md --base main --head "$BRANCH"; then
            gh pr edit "$BRANCH" --body-file /tmp/refresh-summary.md || {
              # Actions are allowed to open PRs as of 2026-08; this stays as a
              # fallback in case that setting is turned back off.
              { echo "Branch [\`$BRANCH\`](https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH) is ready — open the PR from that link (Actions could not create it)."
                echo; cat /tmp/refresh-summary.md; } > /tmp/issue.md
              gh issue create --title "Monthly source refresh $(date +%Y-%m) — PR needs opening" --body-file /tmp/issue.md
            }
          fi
