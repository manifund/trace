# Weekly refresh of the live-fetch sources plus regenerated fund estimates.
# Summary goes to the run page; hard failures email via GitHub; items that
# need human curation (pending dedup candidates, newly flagged orgs) open a
# GitHub issue. dedup --apply and alias merges stay manual on purpose.
name: ingest-weekly
on:
  schedule:
    - cron: '23 10 * * 1' # 10:23 UTC Mondays
  workflow_dispatch:

concurrency: ingest

permissions:
  contents: write
  issues: write

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_TRACE_DB_SCHEMA: ${{ secrets.NEXT_PUBLIC_TRACE_DB_SCHEMA }}
  MANIFUND_SUPABASE_URL: ${{ secrets.MANIFUND_SUPABASE_URL }}
  MANIFUND_SUPABASE_ANON_KEY: ${{ secrets.MANIFUND_SUPABASE_ANON_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Ingest live sources
        run: |
          {
            echo '## Sources'
            echo '```'
            bun run scripts/ingest-ea-funds.ts 2>&1 | tail -3
            bun run scripts/ingest-sff.ts 2>&1 | tail -3
            bun run scripts/ingest-jaan.ts 2>&1 | tail -3
            bun run scripts/ingest-manifund.ts --direct 2>&1 | tail -3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Refresh Coefficient from Algolia
        run: |
          bun run scripts/fetch-coefficient.ts
          {
            echo '## Coefficient'
            echo '```'
            if git diff --quiet data/coefficient-grants.json; then
              echo 'no changes'
            else
              bun run scripts/ingest-coefficient.ts --force 2>&1 | tail -2
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Regenerate fund estimates
        run: |
          {
            echo '## Fund estimates'
            echo '```'
            bun run scripts/build-fund-estimates.ts 2>&1 | tail -12
            bun run scripts/ingest-curated.ts fund_estimates --force 2>&1 | tail -2
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit refreshed data files
        run: |
          if ! git diff --quiet data/curated/fund-estimates.json data/coefficient-grants.json; then
            git config user.name 'trace-ingest[bot]'
            git config user.email 'noreply@manifund.org'
            git add data/curated/fund-estimates.json data/coefficient-grants.json
            git commit -m 'Weekly ingest: refresh Coefficient export / fund estimates'
            git push
          fi
      - name: Dedup report
        run: |
          bun run scripts/dedup.ts 2>&1 | tee /tmp/dedup.txt >/dev/null
          {
            echo '## Dedup'
            echo '```'
            tail -20 /tmp/dedup.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Curation queue
        run: |
          bun run scripts/report-unmatched.ts 12 2>&1 | tee /tmp/unmatched.txt >/dev/null
          bun run scripts/report-untagged.ts 8 2>&1 | tee /tmp/untagged.txt >/dev/null
          {
            echo '## Orgs needing review'
            echo '```'
            head -16 /tmp/unmatched.txt
            echo '```'
            echo "## Grants tagged 'other'"
            echo '```'
            head -20 /tmp/untagged.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open issue if curation needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING=$( (grep -o '"pending":[0-9]*' /tmp/dedup.txt || true) | tail -1 | cut -d: -f2)
          FLAGGED=$( (grep -o '^[0-9]*' <<< "$(head -1 /tmp/unmatched.txt)") || true)
          if [ "${PENDING:-0}" -gt 0 ] || [ "${FLAGGED:-0}" -gt 0 ]; then
            TITLE="Weekly ingest: curation needed ($(date +%Y-%m-%d))"
            {
              echo "From the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): $PENDING pending dedup candidate(s), $FLAGGED flagged org(s)."
              echo
              echo '### Dedup candidates'
              echo '```'
              tail -20 /tmp/dedup.txt
              echo '```'
              echo '### Flagged orgs'
              echo '```'
              head -16 /tmp/unmatched.txt
              echo '```'
              echo
              echo 'Resolve via data/dedup-resolutions.json + `bun run dedup --apply`, and data/aliases.json or data/reviewed-orgs.json + `bun run seed`.'
            } > /tmp/issue.md
            gh issue create --title "$TITLE" --body-file /tmp/issue.md --repo "$GITHUB_REPOSITORY"
          fi
      - name: Verify totals
        run: bun run scripts/verify-totals.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
