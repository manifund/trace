# Manifund ingest, every six hours. Idempotent: unchanged rows are skipped by
# content hash, so a run that finds nothing new costs ~25 seconds.
#
# It runs four times a day to get updates in once a day. GitHub's scheduled
# workflows are best-effort and are dropped under load — this one skipped
# 2026-08-27 entirely, silently, in its second day of life. Four slots mean a
# dropped one costs hours instead of a day. ingest-weekly cross-checks that
# something actually ran.
#
# Fails (-> GitHub failure email) on script errors or verify drift.
name: ingest-daily
on:
  schedule:
    - cron: '17 */6 * * *' # 09:17 UTC and every six hours after
  workflow_dispatch:

concurrency: ingest

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_TRACE_DB_SCHEMA: ${{ secrets.NEXT_PUBLIC_TRACE_DB_SCHEMA }}
  MANIFUND_SUPABASE_URL: ${{ secrets.MANIFUND_SUPABASE_URL }}
  MANIFUND_SUPABASE_ANON_KEY: ${{ secrets.MANIFUND_SUPABASE_ANON_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Ingest Manifund
        run: |
          {
            echo '## Manifund'
            echo '```'
            bun run scripts/ingest-manifund.ts --direct 2>&1 | tail -5
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dedup report
        run: |
          {
            echo '## Dedup'
            echo '```'
            bun run scripts/dedup.ts 2>&1 | tail -3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify totals
        run: bun run scripts/verify-totals.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
