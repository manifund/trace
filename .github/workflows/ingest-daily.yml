# Daily Manifund ingest. Idempotent: unchanged rows are skipped by content
# hash. Fails (-> GitHub failure email) on script errors or verify drift.
name: ingest-daily
on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC daily
  workflow_dispatch:

concurrency: ingest

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_TRACE_DB_SCHEMA: ${{ secrets.NEXT_PUBLIC_TRACE_DB_SCHEMA }}
  MANIFUND_SUPABASE_URL: ${{ secrets.MANIFUND_SUPABASE_URL }}
  MANIFUND_SUPABASE_ANON_KEY: ${{ secrets.MANIFUND_SUPABASE_ANON_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Ingest Manifund
        run: |
          {
            echo '## Manifund'
            echo '```'
            bun run scripts/ingest-manifund.ts --direct 2>&1 | tail -5
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dedup report
        run: |
          {
            echo '## Dedup'
            echo '```'
            bun run scripts/dedup.ts 2>&1 | tail -3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify totals
        run: bun run scripts/verify-totals.ts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
